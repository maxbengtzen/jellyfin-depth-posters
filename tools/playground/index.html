<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Posters playground</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0d0d10; color: #ddd;
    font: 14px system-ui, sans-serif; display: flex; gap: 24px; padding: 24px;
    align-items: flex-start; justify-content: center; flex-wrap: wrap;
  }
  #stage { position: relative; height: min(84vh, 900px); aspect-ratio: 2 / 3; perspective: 900px; }
  canvas {
    width: 100%; height: 100%; display: block; border-radius: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6); transition: transform .08s ease-out;
    transform-style: preserve-3d;
  }
  #panel { width: 280px; display: grid; gap: 14px; }
  label { display: grid; gap: 4px; }
  label span { display: flex; justify-content: space-between; color: #aaa; }
  select, input[type=range] { width: 100%; }
  select { background: #1c1c22; color: #ddd; border: 1px solid #333; padding: 6px; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; }
  p { margin: 0; color: #777; font-size: 12px; line-height: 1.4; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="panel">
  <label>Poster <select id="poster"></select></label>
  <label>Model <select id="model"></select></label>
  <label>Mode <select id="mode">
    <option value="depth">Depth map (ray-march)</option>
    <option value="layers">Layers (inpainted)</option>
  </select></label>
  <label><span>Depth strength <b id="vStrength"></b></span><input id="strength" type="range" min="0" max="0.12" step="0.002" value="0.05"></label>
  <label><span>Focus plane <b id="vFocus"></b></span><input id="focus" type="range" min="0" max="1" step="0.01" value="0.45"></label>
  <label><span>Depth smoothing <b id="vBlur"></b></span><input id="blur" type="range" min="0" max="8" step="0.5" value="2"></label>
  <label><span>Card tilt (degrees) <b id="vTilt"></b></span><input id="tilt" type="range" min="0" max="20" step="0.5" value="8"></label>
  <label class="row"><input id="loop" type="checkbox"> Automatic loop (ignores the mouse)</label>
  <label><span>Loop length (s) <b id="vPeriod"></b></span><input id="period" type="range" min="2" max="12" step="0.5" value="6"></label>
  <label><span>Loop amplitude <b id="vAmp"></b></span><input id="amp" type="range" min="0.1" max="1" step="0.05" value="0.5"></label>
  <label class="row"><input id="showDepth" type="checkbox"> Show depth map</label>
  <p>Hover the poster. Without a pointer (or on touch) it drifts on its own. With the loop on it always follows the same figure-eight.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('c');
const gl = canvas.getContext('webgl', { antialias: true });

const vs = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0., 1.); }`;

// Parallax with a short ray march through the depth map (near = white).
// Image is shifted by (depth - focus) * mouse * strength; the march reduces
// "swimming" at depth edges by finding where the shifted ray hits the surface.
const fs = `precision highp float;
varying vec2 uv;
uniform sampler2D img, dep;
uniform vec2 mouse;
uniform float strength, focus, showDepth;

float depthAt(vec2 t){ return texture2D(dep, t).r; }

void main(){
  // zoom in slightly so shifted edges never reveal the canvas border
  vec2 base = (uv - .5) / (1. + strength * 1.6) + .5;
  vec2 dir = -mouse * strength;
  const int STEPS = 24;
  float layerD = 1. / float(STEPS);
  float cur = 1.;                      // ray height, from near (1) to far (0)
  vec2 t = base + dir * (1. - focus);  // ray entry on the near plane
  vec2 stepv = dir * layerD * -1.;
  float d = depthAt(t);
  for (int i = 0; i < STEPS; i++) {
    if (cur <= d) break;
    cur -= layerD; t += stepv; d = depthAt(t);
  }
  t = clamp(t, vec2(0.001), vec2(.999));
  vec3 col = showDepth > .5 ? vec3(depthAt(t)) : texture2D(img, t).rgb;
  // subtle moving highlight, like the tvOS icons
  float glare = pow(max(0., 1. - distance(uv, .5 + mouse * .5) * 1.4), 3.) * .10;
  gl_FragColor = vec4(col + glare, 1.);
}`;

// Layer mode: each pre-cut, inpainted RGBA layer is shifted by its own depth and
// composited back to front (premultiplied alpha).
const fsLayer = `precision highp float;
varying vec2 uv;
uniform sampler2D tex;
uniform vec2 offset, mouse;
uniform float zoom;
void main(){
  vec2 t = clamp((uv - .5) / zoom + .5 + offset, vec2(0.), vec2(1.));
  vec4 c = texture2D(tex, t);
  float glare = pow(max(0., 1. - distance(uv, .5 + mouse * .5) * 1.4), 3.) * .10;
  gl_FragColor = c + vec4(vec3(glare) * c.a, 0.);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(fragment){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragment));
  gl.linkProgram(p);
  return p;
}
const progDepth = makeProgram(fs), progLayer = makeProgram(fsLayer);
let prog = progDepth;
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
function use(p){
  prog = p; gl.useProgram(p);
  const loc = gl.getAttribLocation(p, 'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}
use(progDepth);
const U = n => gl.getUniformLocation(prog, n);

function makeTexture(unit, image, rgba = false){
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, rgba);
  const fmt = rgba ? gl.RGBA : gl.RGB;
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, fmt, gl.UNSIGNED_BYTE, image);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// Downscale huge posters so they fit in a WebGL texture and stay fast.
function fit(image, max = 1600, blurPx = 0){
  const k = Math.min(1, max / Math.max(image.width, image.height));
  const c = document.createElement('canvas');
  c.width = Math.round(image.width * k); c.height = Math.round(image.height * k);
  const ctx = c.getContext('2d');
  if (blurPx) ctx.filter = `blur(${blurPx}px)`;
  ctx.drawImage(image, 0, 0, c.width, c.height);
  return c;
}

let manifest = [], loaded = false, layerTextures = [], layerDepths = [], layerMode = false;
const currentEntry = () => manifest.find(e => e.name === $('poster').value);

// The layer option is only available when layers exist for the chosen model.
function updateModes(){
  const has = !!currentEntry().layers?.[$('model').value];
  $('mode').querySelector('option[value=layers]').disabled = !has;
  if (!has) $('mode').value = 'depth';
}

async function show(){
  updateModes();
  const entry = currentEntry(), model = $('model').value;
  layerMode = $('mode').value === 'layers';
  loaded = false;
  if (layerMode) {
    const { files, depths } = entry.layers[model];
    const imgs = await Promise.all(files.map(load));
    canvas.width = imgs[0].width; canvas.height = imgs[0].height;
    use(progLayer);
    layerTextures = imgs.map((im, k) => makeTexture(k, im, true));
    layerDepths = depths;
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  } else {
    const [img, dep] = await Promise.all([load(entry.poster), load(entry.depths[model])]);
    const im = fit(img), dp = fit(dep, 1600, +$('blur').value);
    canvas.width = im.width; canvas.height = im.height;
    use(progDepth);
    gl.disable(gl.BLEND);
    makeTexture(0, im); makeTexture(1, dp);
    gl.uniform1i(U('img'), 0); gl.uniform1i(U('dep'), 1);
  }
  $('stage').style.aspectRatio = `${canvas.width} / ${canvas.height}`;
  gl.viewport(0, 0, canvas.width, canvas.height);
  loaded = true;
}

// Pointer in -1..1; eased towards target. Falls back to a gentle idle wobble.
let target = [0, 0], cur = [0, 0], lastMove = -1e9;
const stage = $('stage');
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  target = [((e.clientX - r.left) / r.width) * 2 - 1, ((e.clientY - r.top) / r.height) * 2 - 1];
  lastMove = performance.now();
});
stage.addEventListener('pointerleave', () => { lastMove = performance.now() - 1500; });

const sliders = ['strength', 'focus', 'blur', 'tilt', 'period', 'amp'];
sliders.forEach(id => { const f = () => $('v' + id[0].toUpperCase() + id.slice(1)).textContent = $(id).value; $(id).oninput = f; f(); });

function frame(now){
  requestAnimationFrame(frame);
  if (!loaded) return;
  const idle = now - lastMove > 2500;
  if ($('loop').checked) {
    // Figure-eight (1:2 Lissajous) that returns exactly to its start every period.
    const a = 2 * Math.PI * now / 1000 / +$('period').value, r = +$('amp').value;
    target = [Math.sin(a) * r, Math.sin(2 * a) * r * .5];
  } else if (idle) target = [Math.sin(now / 1400) * .7, Math.cos(now / 1900) * .5];
  const ease = $('loop').checked ? .3 : .12;
  cur = cur.map((v, i) => v + (target[i] - v) * ease);
  const strength = +$('strength').value, focus = +$('focus').value;
  gl.uniform2f(U('mouse'), cur[0], cur[1]);
  if (layerMode) {
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U('zoom'), 1 + strength * 1.6);
    layerTextures.forEach((tex, k) => {
      gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(U('tex'), k);
      const s = -strength * (layerDepths[k] - focus);
      gl.uniform2f(U('offset'), cur[0] * s, cur[1] * s);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    });
  } else {
    gl.uniform1f(U('strength'), strength);
    gl.uniform1f(U('focus'), focus);
    gl.uniform1f(U('showDepth'), $('showDepth').checked ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  const t = +$('tilt').value;
  canvas.style.transform = `rotateY(${cur[0] * t}deg) rotateX(${-cur[1] * t}deg)`;
}

(async () => {
  manifest = await (await fetch('output/manifest.json', { cache: 'no-store' })).json();
  manifest = manifest.filter(e => Object.keys(e.depths).length);
  $('poster').innerHTML = manifest.map(e => `<option>${e.name}</option>`).join('');
  const fillModels = () => {
    const entry = manifest.find(e => e.name === $('poster').value);
    $('model').innerHTML = Object.keys(entry.depths).map(m => `<option>${m}</option>`).join('');
    if (entry.depths.base) $('model').value = 'base';
  };
  $('poster').onchange = () => { fillModels(); show(); };
  $('model').onchange = show;
  $('mode').onchange = show;
  $('blur').onchange = show;
  // Optional ?poster=&model=&mode=&loop=1 to open a specific view.
  const q = new URLSearchParams(location.search);
  if (q.get('poster')) $('poster').value = q.get('poster');
  fillModels();
  if (q.get('model')) $('model').value = q.get('model');
  if (q.get('mode')) $('mode').value = q.get('mode');
  if (q.get('loop')) $('loop').checked = true;
  await show();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
