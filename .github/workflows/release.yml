name: Release

# Tag a version (e.g. v1.0.0) to publish the Docker image and the plugin.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}.0" >> "$GITHUB_OUTPUT"
      - name: Build and package
        run: |
          dotnet publish plugin -c Release -p:Version=${{ steps.v.outputs.version }} -p:AssemblyVersion=${{ steps.v.outputs.version }} -p:FileVersion=${{ steps.v.outputs.version }} -o dist
          jq --arg v "${{ steps.v.outputs.version }}" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.version=$v | .timestamp=$t' plugin/meta.json > dist/meta.json
          cd dist && zip -j "../jellyfin-depth-posters_${{ steps.v.outputs.version }}.zip" Jellyfin.Plugin.DepthPosters.dll meta.json
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "jellyfin-depth-posters_${{ steps.v.outputs.version }}.zip" --generate-notes
      - name: Update plugin repository manifest
        run: |
          python3 scripts/update_manifest.py "${{ steps.v.outputs.version }}" \
            "jellyfin-depth-posters_${{ steps.v.outputs.version }}.zip" \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/jellyfin-depth-posters_${{ steps.v.outputs.version }}.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${GITHUB_REF_NAME} to plugin manifest"
          git push origin HEAD:main
