name: Release

# Push a version tag (e.g. v1.0.0) to test it, publish the Docker image to ghcr.io and
# attach the Jellyfin plugin to a GitHub release. Run it by hand with an existing tag to
# publish that release again.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::tag must be vX.Y.Z, got '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  image:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin:
    needs: [ci, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        run: |
          dotnet publish plugin -c Release -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION" -o dist
          jq --arg v "$VERSION" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.version=$v | .timestamp=$t' plugin/meta.json > dist/meta.json
          (cd dist && zip -j "../jellyfin-depth-posters_${VERSION}.zip" Jellyfin.Plugin.DepthPosters.dll meta.json)
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "jellyfin-depth-posters_${VERSION}.zip" --clobber
          else
            gh release create "$TAG" "jellyfin-depth-posters_${VERSION}.zip" --verify-tag --generate-notes
          fi
      - name: Add the version to the plugin repository manifest
        run: |
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          python3 scripts/update_manifest.py "$VERSION" "jellyfin-depth-posters_${VERSION}.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/jellyfin-depth-posters_${VERSION}.zip"
          git diff --quiet manifest.json && { echo "manifest already lists $VERSION"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: add ${TAG} to the plugin manifest"
          git push origin main
